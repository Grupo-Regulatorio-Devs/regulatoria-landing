<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Iconos 3D agentes</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#fff;padding:40px;color:#0F1A0A}
h2{font-size:1rem;margin:28px 0 12px;color:#5A6B52;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:22px}
.cell{text-align:center;width:110px}
.agi{width:44px;height:44px;filter:drop-shadow(0 2px 3px rgba(15,26,10,.3))}
.nm{font-size:.62rem;font-weight:800;margin-top:6px;letter-spacing:.04em}
.pre{color:#2563EB}.reg{color:#5AAD2D}.post{color:#EA580C}.dark{color:#2B5A14}
.node{width:88px;height:88px;border-radius:50%;background:#fff;border:2px solid;display:flex;flex-direction:column;
  align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(43,90,20,.12);margin:0 auto}
.node .agi{width:26px;height:26px;margin-bottom:2px}
.node b{font-size:.55rem;letter-spacing:.03em;color:#0F1A0A}
.sm .agi{width:15px;height:15px;vertical-align:-3px;margin-right:6px}
.tag{display:inline-flex;align-items:center;padding:6px 13px;border:1px solid rgba(43,90,20,.18);border-radius:50px;font-size:.76rem;font-weight:600;margin:4px}
.dk{background:#0d1f09;padding:20px;border-radius:14px;margin-top:10px}
.dk .agi{width:15px;height:15px;vertical-align:-3px;margin-right:8px}
.dk div{color:rgba(255,255,255,.62);font-size:.75rem;padding:5px 0;font-weight:500}
</style></head><body>

<script>
var ic=[['compass','COMPASS','pre'],['predict','PREDICT','pre'],['genesis','GENESIS','pre'],['scout','SCOUT','pre'],

 s3+='<span class="tag sm '+a[2]+'"><svg class="agi"><use href="#ic-'+a[0]+'"/></svg><span style="color:#0F1A0A">'+a[1]+'</span></span>';
 s4+='<div style="color:#7BC950"><svg class="agi"><use href="#ic-'+a[0]+'"/></svg><span style="color:rgba(255,255,255,.62)">'+a[1]+'</span></div>';
});
